<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عزة - حب عمري</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:ital,wght@0,700;1,700&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#a18cd1 0%,#fbc2eb 50%,#8e44ad 100%);overflow:hidden;font-family:'Cairo'}
.hearts{position:fixed;inset:0;pointer-events:none}
.hearts span{position:absolute;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.card{z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);padding:55px 45px;border-radius:40px;text-align:center;box-shadow:0 30px 90px rgba(142,68,173,.4),0 0 0 12px rgba(255,255,255,.3);animation:float 3s ease-in-out infinite;width:460px;max-width:92%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.big-heart{font-size:62px;animation:pulse 1s infinite;display:block}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
h1{font-family:'Aref Ruqaa';font-size:52px;background:linear-gradient(90deg,#6a1b9a,#ff2e86);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.name{font-family:'Amiri';font-size:36px;color:#6a1b9a;margin-top:5px}
.divider{width:110px;height:4px;background:linear-gradient(90deg,#6a1b9a,#ffb6d9);margin:18px auto;border-radius:50px}
.msg{font-size:19px;color:#4a235a;line-height:2.1;font-weight:600}
.msg .pink{color:#e91e63;display:block;margin-top:10px;font-size:20px}
.msg .big-love{font-family:'Aref Ruqaa';font-size:28px;color:#6a1b9a;margin-top:16px;display:block;line-height:1.5}
.from{margin-top:24px;font-size:13px;color:#8e7a85;letter-spacing:1px}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
  <span class="big-heart">💜</span>
  <h1>عَزَّتِي .. حُب عُمري</h1>
  <div class="name">𓆩 AZZA 𓆪</div>
  <div class="divider"></div>
  <div class="msg">
    <span>من يوم ما شفتك وقلبي مش بتاعي</span>
    <span>بقى بتاعك إنتِي وبس</span>
    <span class="pink">✧ كل نبضة فيا بتنادي بإسمك ✧</span>
    <span class="pink">✧ بحبك أكتر ما الكلام يقدر يوصف ✧</span>
    <span class="big-love">إنتِي دُنيتي ونور عيني<br>ومستحيل أسيبك مهما حصل</span>
  </div>
  <div class="from">كِيمُوو ♾️ عَزَّة للأبد</div>
</div>

<audio id="song" autoplay loop playsinline>
  <source src="kk.mpeg" type="audio/mpeg">
</audio>

<script>
const c=document.getElementById('hearts');
for(let i=0;i<30;i++){let s=document.createElement('span');s.innerHTML=['💜','💖','🌸','✨','💗','🌹'][Math.floor(Math.random()*6)];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(3+Math.random()*6)+'s';s.style.animationDelay=Math.random()*5+'s';s.style.top='-5vh';s.style.fontSize=(18+Math.random()*10)+'px';s.style.position='absolute';c.appendChild(s);}
const a=document.getElementById('song');a.volume=0.95;
function go(){a.play().catch(()=>{});}
window.addEventListener('load',go);
document.addEventListener('click',go,{once:true});
document.addEventListener('touchstart',go,{once:true});
setInterval(go,800);
</script>
</body>
</html>

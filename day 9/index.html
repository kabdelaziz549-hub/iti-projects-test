<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاطمة ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@700&family=Cairo:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#ff9a9e 0%,#fecfef 30%,#ff6a88 100%);overflow:hidden;font-family:'Cairo'}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.card{z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);padding:60px 55px;border-radius:40px;text-align:center;box-shadow:0 30px 90px rgba(255,20,80,.35),0 0 0 12px rgba(255,255,255,.3);animation:float 3s ease-in-out infinite;width:420px;max-width:92%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.big-heart{font-size:58px;display:block;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
h1{font-family:'Aref Ruqaa';font-size:58px;background:linear-gradient(90deg,#a50036,#ff2e63);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.name{font-family:'Amiri';font-size:34px;color:#a50036}
.divider{width:100px;height:4px;background:linear-gradient(90deg,#a50036,#ffb3c6);margin:20px auto;border-radius:50px}
.msg{font-size:20px;color:#5a2a3a;line-height:2;font-weight:600}
.msg .line2{color:#ff2e63;margin-top:12px;display:block}
.msg .line3{font-family:'Aref Ruqaa';font-size:26px;margin-top:14px;color:#a50036}
.from{margin-top:22px;font-size:14px;color:#9a6a7a}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
  <span class="big-heart">💖</span>
  <h1>بِحُبِّكِ يا فَاطِمَة</h1>
  <div class="name">— 𓆩 FᗩTᗰᗩ 𓆪 —</div>
  <div class="divider"></div>
  <div class="msg">
    <span>حَبِيبِك كِيمُوو بِيعْتَذِرْلِك</span>
    <span>عَن أي حَاجَة زَعَلِتِك فِيهَا</span>
    <span class="line2">✧ إنتِي أحْلَى حَاجَة فِي حَيَاتِي ✧</span>
    <span class="line3">خَلِّيكِ مَعَايَا يَا حَبِيبِي مَهْمَا كَان</span>
  </div>
  <div class="from">كِيمُوو ♾️ فَاطِمَة</div>
</div>

<audio id="song" autoplay loop playsinline>
  <source src="kk.mpeg" type="audio/mpeg">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const c=document.getElementById('hearts');
for(let i=0;i<25;i++){let s=document.createElement('span');s.innerHTML=['💖','💗','💓','✨','🌹'][Math.floor(Math.random()*5)];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(4+Math.random()*6)+'s';s.style.animationDelay=Math.random()*5+'s';s.style.top='-5vh';s.style.fontSize='20px';s.style.position='absolute';c.appendChild(s);}
const a=document.getElementById('song');a.volume=0.9;
function go(){a.play().catch(()=>{});}
window.addEventListener('load',go);
document.addEventListener('click',go,{once:true});
document.addEventListener('touchstart',go,{once:true});
setInterval(go,1000);
</script>
</body>
</html>
